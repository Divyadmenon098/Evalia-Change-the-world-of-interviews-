<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interview Feedback Platform - Evalia</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect } = React;

        // Lucide icons as React components
        const UserCircle = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <circle cx="12" cy="10" r="3"></circle>
                <path d="M7 20.662V19a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v1.662"></path>
            </svg>
        );

        const Briefcase = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
                <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
            </svg>
        );

        const Send = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
        );

        const FileText = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
                <line x1="16" y1="13" x2="8" y2="13"></line>
                <line x1="16" y1="17" x2="8" y2="17"></line>
                <polyline points="10 9 9 9 8 9"></polyline>
            </svg>
        );

        const TrendingUp = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline>
                <polyline points="17 6 23 6 23 12"></polyline>
            </svg>
        );

        const AlertCircle = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
        );

        function RecruiterFeedbackPlatform() {
          const [activeTab, setActiveTab] = useState('recruiter');
          const [candidates, setCandidates] = useState([]);
          const [selectedCandidate, setSelectedCandidate] = useState(null);
          
          const [candidateName, setCandidateName] = useState('');
          const [candidateId, setCandidateId] = useState('');
          const [interviewerName, setInterviewerName] = useState('');
          const [interviewRound, setInterviewRound] = useState('');
          const [interviewNotes, setInterviewNotes] = useState('');
          
          const [searchId, setSearchId] = useState('');

          useEffect(() => {
            loadCandidates();
          }, []);

          const loadCandidates = () => {
            const stored = localStorage.getItem('candidates');
            if (stored) {
              setCandidates(JSON.parse(stored));
            }
          };

          const saveCandidates = (updatedCandidates) => {
            localStorage.setItem('candidates', JSON.stringify(updatedCandidates));
            setCandidates(updatedCandidates);
          };

          const handleSubmitFeedback = () => {
            if (!candidateName || !candidateId || !interviewerName || !interviewRound || !interviewNotes) {
              alert('Please fill in all fields');
              return;
            }
            
            const newInterview = {
              interviewer: interviewerName,
              round: interviewRound,
              notes: interviewNotes,
              date: new Date().toISOString()
            };

            let updatedCandidates = [...candidates];
            const existingIndex = updatedCandidates.findIndex(c => c.id === candidateId);

            if (existingIndex >= 0) {
              updatedCandidates[existingIndex].interviews.push(newInterview);
            } else {
              updatedCandidates.push({
                id: candidateId,
                name: candidateName,
                interviews: [newInterview],
                createdAt: new Date().toISOString()
              });
            }

            saveCandidates(updatedCandidates);
            
            setInterviewerName('');
            setInterviewRound('');
            setInterviewNotes('');
            
            alert('Feedback submitted successfully!');
          };

          const generateAIFeedback = (interviews) => {
            const allNotes = interviews.map(i => i.notes).join(' ');
            
            const positiveKeywords = ['good', 'excellent', 'strong', 'impressive', 'confident', 'skilled', 'knowledgeable', 'clear', 'well', 'great', 'effective', 'thorough', 'experienced'];
            const negativeKeywords = ['weak', 'lacking', 'insufficient', 'needs improvement', 'struggled', 'unclear', 'poor', 'limited', 'difficulty', 'confused', 'inexperienced'];
            
            const lowerNotes = allNotes.toLowerCase();
            
            const positives = [];
            if (lowerNotes.includes('technical') && positiveKeywords.some(k => lowerNotes.includes(k))) {
              positives.push('Demonstrated solid technical knowledge and problem-solving abilities');
            }
            if (lowerNotes.includes('communication') && positiveKeywords.some(k => lowerNotes.includes(k))) {
              positives.push('Excellent communication skills and ability to articulate ideas clearly');
            }
            if (lowerNotes.includes('experience') && positiveKeywords.some(k => lowerNotes.includes(k))) {
              positives.push('Relevant experience and practical understanding of the domain');
            }
            if (positives.length === 0) {
              positives.push('Shows enthusiasm and willingness to learn');
              positives.push('Professional demeanor throughout the interview process');
            }
            
            const negatives = [];
            if (lowerNotes.includes('technical') && negativeKeywords.some(k => lowerNotes.includes(k))) {
              negatives.push('Would benefit from strengthening technical fundamentals and hands-on practice');
            }
            if (lowerNotes.includes('communication') && negativeKeywords.some(k => lowerNotes.includes(k))) {
              negatives.push('Consider working on articulating thoughts more clearly and concisely');
            }
            if (lowerNotes.includes('experience') && negativeKeywords.some(k => lowerNotes.includes(k))) {
              negatives.push('Gaining more practical experience in relevant technologies would be beneficial');
            }
            if (negatives.length === 0) {
              negatives.push('Continue building depth in core competencies');
              negatives.push('Expand exposure to real-world project scenarios');
            }
            
            return { positives, negatives };
          };

          const handleSearchCandidate = () => {
            const candidate = candidates.find(c => c.id === searchId);
            setSelectedCandidate(candidate || null);
          };

          return (
            <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100">
              <div className="container mx-auto px-4 py-8 max-w-6xl">
                <div className="bg-white rounded-lg shadow-lg p-6 mb-6">
                  <div className="flex items-center gap-3 mb-2">
                    <Briefcase />
                    <h1 className="text-3xl font-bold text-gray-800">Interview Feedback Platform - Evalia</h1>
                  </div>
                  <p className="text-gray-600">Helping candidates improve through constructive feedback</p>
                </div>

                <div className="bg-white rounded-lg shadow-lg mb-6">
                  <div className="flex border-b">
                    <button
                      onClick={() => setActiveTab('recruiter')}
                      className={`flex-1 px-6 py-4 font-semibold transition-colors ${
                        activeTab === 'recruiter'
                          ? 'text-indigo-600 border-b-2 border-indigo-600'
                          : 'text-gray-500 hover:text-gray-700'
                      }`}
                    >
                      <div className="flex items-center justify-center gap-2">
                        <UserCircle />
                        Recruiter Portal
                      </div>
                    </button>
                    <button
                      onClick={() => setActiveTab('candidate')}
                      className={`flex-1 px-6 py-4 font-semibold transition-colors ${
                        activeTab === 'candidate'
                          ? 'text-indigo-600 border-b-2 border-indigo-600'
                          : 'text-gray-500 hover:text-gray-700'
                      }`}
                    >
                      <div className="flex items-center justify-center gap-2">
                        <FileText />
                        Candidate Feedback
                      </div>
                    </button>
                  </div>

                  {activeTab === 'recruiter' && (
                    <div className="p-6">
                      <h2 className="text-2xl font-bold text-gray-800 mb-6">Submit Interview Feedback</h2>
                      <div className="space-y-4">
                        <div className="grid md:grid-cols-2 gap-4">
                          <div>
                            <label className="block text-sm font-medium text-gray-700 mb-2">
                              Candidate Name
                            </label>
                            <input
                              type="text"
                              value={candidateName}
                              onChange={(e) => setCandidateName(e.target.value)}
                              className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                              placeholder="John Doe"
                            />
                          </div>
                          <div>
                            <label className="block text-sm font-medium text-gray-700 mb-2">
                              Candidate ID
                            </label>
                            <input
                              type="text"
                              value={candidateId}
                              onChange={(e) => setCandidateId(e.target.value)}
                              className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                              placeholder="CAND-2024-001"
                            />
                          </div>
                        </div>

                        <div className="grid md:grid-cols-2 gap-4">
                          <div>
                            <label className="block text-sm font-medium text-gray-700 mb-2">
                              Interviewer Name
                            </label>
                            <input
                              type="text"
                              value={interviewerName}
                              onChange={(e) => setInterviewerName(e.target.value)}
                              className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                              placeholder="Jane Smith"
                            />
                          </div>
                          <div>
                            <label className="block text-sm font-medium text-gray-700 mb-2">
                              Interview Round
                            </label>
                            <select
                              value={interviewRound}
                              onChange={(e) => setInterviewRound(e.target.value)}
                              className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                            >
                              <option value="">Select Round</option>
                              <option value="Screening">Screening</option>
                              <option value="Technical Round 1">Technical Round 1</option>
                              <option value="Technical Round 2">Technical Round 2</option>
                              <option value="HR Round">HR Round</option>
                              <option value="Final Round">Final Round</option>
                            </select>
                          </div>
                        </div>

                        <div>
                          <label className="block text-sm font-medium text-gray-700 mb-2">
                            Interview Notes
                          </label>
                          <textarea
                            value={interviewNotes}
                            onChange={(e) => setInterviewNotes(e.target.value)}
                            className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent h-32"
                            placeholder="Enter your observations about the candidate's performance, technical skills, communication abilities, and areas of improvement..."
                          />
                        </div>

                        <button
                          onClick={handleSubmitFeedback}
                          className="w-full bg-indigo-600 text-white py-3 rounded-lg font-semibold hover:bg-indigo-700 transition-colors flex items-center justify-center gap-2"
                        >
                          <Send />
                          Submit Feedback
                        </button>
                      </div>
                    </div>
                  )}

                  {activeTab === 'candidate' && (
                    <div className="p-6">
                      <h2 className="text-2xl font-bold text-gray-800 mb-6">View Your Feedback</h2>
                      
                      <div className="mb-6">
                        <label className="block text-sm font-medium text-gray-700 mb-2">
                          Enter Your Candidate ID
                        </label>
                        <div className="flex gap-2">
                          <input
                            type="text"
                            value={searchId}
                            onChange={(e) => setSearchId(e.target.value)}
                            className="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                            placeholder="CAND-2024-001"
                          />
                          <button
                            onClick={handleSearchCandidate}
                            className="bg-indigo-600 text-white px-6 py-2 rounded-lg font-semibold hover:bg-indigo-700 transition-colors"
                          >
                            Search
                          </button>
                        </div>
                      </div>

                      {selectedCandidate === null && searchId && (
                        <div className="bg-yellow-50 border border-yellow-200 rounded-lg p-4 flex items-start gap-3">
                          <AlertCircle />
                          <div>
                            <p className="font-medium text-yellow-800">No feedback found</p>
                            <p className="text-sm text-yellow-700">Please check your Candidate ID and try again.</p>
                          </div>
                        </div>
                      )}

                      {selectedCandidate && (
                        <div className="space-y-6">
                          <div className="bg-gradient-to-r from-indigo-50 to-blue-50 rounded-lg p-6">
                            <h3 className="text-xl font-bold text-gray-800 mb-2">{selectedCandidate.name}</h3>
                            <p className="text-gray-600">Candidate ID: {selectedCandidate.id}</p>
                            <p className="text-sm text-gray-500 mt-1">
                              Total Interviews: {selectedCandidate.interviews.length}
                            </p>
                          </div>

                          {(() => {
                            const feedback = generateAIFeedback(selectedCandidate.interviews);
                            return (
                              <>
                                <div className="bg-green-50 rounded-lg p-6 border border-green-200">
                                  <div className="flex items-center gap-2 mb-4">
                                    <TrendingUp />
                                    <h4 className="text-lg font-bold text-green-800">Your Strengths</h4>
                                  </div>
                                  <ul className="space-y-2">
                                    {feedback.positives.map((positive, idx) => (
                                      <li key={idx} className="flex items-start gap-2">
                                        <span className="text-green-600 font-bold">✓</span>
                                        <span className="text-gray-700">{positive}</span>
                                      </li>
                                    ))}
                                  </ul>
                                </div>

                                <div className="bg-blue-50 rounded-lg p-6 border border-blue-200">
                                  <div className="flex items-center gap-2 mb-4">
                                    <FileText />
                                    <h4 className="text-lg font-bold text-blue-800">Areas for Growth</h4>
                                  </div>
                                  <ul className="space-y-2">
                                    {feedback.negatives.map((negative, idx) => (
                                      <li key={idx} className="flex items-start gap-2">
                                        <span className="text-blue-600 font-bold">→</span>
                                        <span className="text-gray-700">{negative}</span>
                                      </li>
                                    ))}
                                  </ul>
                                </div>
                              </>
                            );
                          })()}

                          <div className="bg-gray-50 rounded-lg p-6 border border-gray-200">
                            <h4 className="text-lg font-bold text-gray-800 mb-4">Interview Timeline</h4>
                            <div className="space-y-3">
                              {selectedCandidate.interviews.map((interview, idx) => (
                                <div key={idx} className="bg-white rounded p-4 border border-gray-200">
                                  <div className="flex justify-between items-start mb-2">
                                    <span className="font-semibold text-gray-800">{interview.round}</span>
                                    <span className="text-sm text-gray-500">
                                      {new Date(interview.date).toLocaleDateString()}
                                    </span>
                                  </div>
                                  <p className="text-sm text-gray-600 mb-1">Interviewer: {interview.interviewer}</p>
                                  <p className="text-sm text-gray-700">{interview.notes}</p>
                                </div>
                              ))}
                            </div>
                          </div>
                        </div>
                      )}
                    </div>
                  )}
                </div>
              </div>
            </div>
          );
        }

        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(React.createElement(RecruiterFeedbackPlatform));
    </script>
</body>
</html>
