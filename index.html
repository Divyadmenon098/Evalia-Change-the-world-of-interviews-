<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evalia - Interview Feedback Platform</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect } = React;

        // Lucide icons as React components
        const UserCircle = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <circle cx="12" cy="10" r="3"></circle>
                <path d="M7 20.662V19a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v1.662"></path>
            </svg>
        );

        const Building2 = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"></path>
                <path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"></path>
                <path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"></path>
                <path d="M10 6h4"></path>
                <path d="M10 10h4"></path>
                <path d="M10 14h4"></path>
                <path d="M10 18h4"></path>
            </svg>
        );

        const Send = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
        );

        const UserPlus = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
                <circle cx="9" cy="7" r="4"></circle>
                <line x1="19" y1="8" x2="19" y2="14"></line>
                <line x1="22" y1="11" x2="16" y2="11"></line>
            </svg>
        );

        const Mail = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
            </svg>
        );

        const Eye = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
                <circle cx="12" cy="12" r="3"></circle>
            </svg>
        );

        const CheckCircle = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                <polyline points="22 4 12 14.01 9 11.01"></polyline>
            </svg>
        );

        const AlertCircle = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
        );

        function EvaliaHRPlatform() {
          const [activeTab, setActiveTab] = useState('setup');
          const [companyCode, setCompanyCode] = useState('');
          const [companyName, setCompanyName] = useState('');
          const [isCompanySetup, setIsCompanySetup] = useState(false);
          const [loginMode, setLoginMode] = useState('signup');
          const [loginCompanyCode, setLoginCompanyCode] = useState('');
          
          const [candidates, setCandidates] = useState([]);
          const [selectedCandidate, setSelectedCandidate] = useState(null);
          const [showPreview, setShowPreview] = useState(false);
          
          const [candidateName, setCandidateName] = useState('');
          const [candidateEmail, setCandidateEmail] = useState('');
          const [appliedPosition, setAppliedPosition] = useState('');
          const [candidateId, setCandidateId] = useState('');
          const [interviewerName, setInterviewerName] = useState('');
          const [interviewRound, setInterviewRound] = useState('');
          const [interviewNotes, setInterviewNotes] = useState('');

          useEffect(() => {
            loadCompanyData();
          }, []);

          const loadCompanyData = () => {
            const savedCompanyCode = localStorage.getItem('companyCode');
            const savedCompanyName = localStorage.getItem('companyName');
            if (savedCompanyCode && savedCompanyName) {
              setCompanyCode(savedCompanyCode);
              setCompanyName(savedCompanyName);
              setIsCompanySetup(true);
              loadCandidates(savedCompanyCode);
              setActiveTab('dashboard');
            }
          };

          const loadCandidates = (code) => {
            const stored = localStorage.getItem(`candidates_${code}`);
            if (stored) {
              setCandidates(JSON.parse(stored));
            }
          };

          const saveCandidates = (updatedCandidates) => {
            localStorage.setItem(`candidates_${companyCode}`, JSON.stringify(updatedCandidates));
            setCandidates(updatedCandidates);
          };

          const handleCompanySetup = () => {
            if (!companyCode || !companyName) {
              alert('Please fill in all company details');
              return;
            }
            
            const existingCompanyName = localStorage.getItem(`company_${companyCode}`);
            if (existingCompanyName) {
              alert('This company code already exists! Please use the login option or choose a different code.');
              return;
            }
            
            localStorage.setItem('companyCode', companyCode);
            localStorage.setItem('companyName', companyName);
            localStorage.setItem(`company_${companyCode}`, companyName);
            setIsCompanySetup(true);
            setActiveTab('dashboard');
          };

          const handleCompanyLogin = () => {
            if (!loginCompanyCode) {
              alert('Please enter your company code');
              return;
            }
            
            const existingCompanyName = localStorage.getItem(`company_${loginCompanyCode}`);
            if (!existingCompanyName) {
              alert('Company code not found! Please check your code or create a new workspace.');
              return;
            }
            
            setCompanyCode(loginCompanyCode);
            setCompanyName(existingCompanyName);
            localStorage.setItem('companyCode', loginCompanyCode);
            localStorage.setItem('companyName', existingCompanyName);
            setIsCompanySetup(true);
            loadCandidates(loginCompanyCode);
            setActiveTab('dashboard');
          };

          const handleAddInterview = () => {
            if (!candidateName || !candidateEmail || !appliedPosition || !candidateId || !interviewerName || !interviewRound || !interviewNotes) {
              alert('Please fill in all fields');
              return;
            }

            const newInterview = {
              interviewer: interviewerName,
              round: interviewRound,
              notes: interviewNotes,
              date: new Date().toISOString()
            };

            let updatedCandidates = [...candidates];
            const existingIndex = updatedCandidates.findIndex(c => c.id === candidateId);

            if (existingIndex >= 0) {
              updatedCandidates[existingIndex].interviews.push(newInterview);
            } else {
              updatedCandidates.push({
                id: candidateId,
                name: candidateName,
                email: candidateEmail,
                position: appliedPosition,
                interviews: [newInterview],
                status: 'In Progress',
                feedbackSent: false,
                createdAt: new Date().toISOString()
              });
            }

            saveCandidates(updatedCandidates);
            
            setInterviewerName('');
            setInterviewRound('');
            setInterviewNotes('');
            
            alert('Interview feedback added successfully!');
            setActiveTab('dashboard');
          };

          const generateFeedback = (candidate) => {
            const allNotes = candidate.interviews.map(i => i.notes).join(' ');
            const lowerNotes = allNotes.toLowerCase();
            
            const positiveKeywords = ['good', 'excellent', 'strong', 'impressive', 'confident', 'skilled', 'knowledgeable', 'clear', 'well', 'great', 'effective', 'thorough', 'experienced'];
            const negativeKeywords = ['weak', 'lacking', 'insufficient', 'needs improvement', 'struggled', 'unclear', 'poor', 'limited', 'difficulty', 'confused', 'inexperienced'];
            
            const strengths = [];
            if (lowerNotes.includes('technical') && positiveKeywords.some(k => lowerNotes.includes(k))) {
              strengths.push('Strong technical knowledge and problem-solving abilities');
            }
            if (lowerNotes.includes('communication') && positiveKeywords.some(k => lowerNotes.includes(k))) {
              strengths.push('Excellent communication and articulation skills');
            }
            if (lowerNotes.includes('experience') && positiveKeywords.some(k => lowerNotes.includes(k))) {
              strengths.push('Relevant experience and practical understanding');
            }
            if (strengths.length === 0) {
              strengths.push('Professional demeanor and enthusiasm');
              strengths.push('Good cultural fit and team collaboration potential');
            }
            
            const improvements = [];
            if (lowerNotes.includes('technical') && negativeKeywords.some(k => lowerNotes.includes(k))) {
              improvements.push('Strengthen technical fundamentals through additional practice');
            }
            if (lowerNotes.includes('communication') && negativeKeywords.some(k => lowerNotes.includes(k))) {
              improvements.push('Work on articulating thoughts more clearly and concisely');
            }
            if (lowerNotes.includes('experience') && negativeKeywords.some(k => lowerNotes.includes(k))) {
              improvements.push('Gain more hands-on experience with relevant technologies');
            }
            if (improvements.length === 0) {
              improvements.push('Continue building depth in core competencies');
              improvements.push('Expand exposure to diverse project scenarios');
            }
            
            return { strengths, improvements };
          };

          const handleSendFeedback = (candidate) => {
            const feedback = generateFeedback(candidate);
            
            const emailContent = `
Dear ${candidate.name},

Thank you for taking the time to interview with ${companyName} for the ${candidate.position} position.

After careful consideration of your interviews, we wanted to provide you with detailed feedback to help you in your career journey.

YOUR STRENGTHS:
${feedback.strengths.map((s, i) => `${i + 1}. ${s}`).join('\n')}

AREAS FOR GROWTH:
${feedback.improvements.map((imp, i) => `${i + 1}. ${imp}`).join('\n')}

INTERVIEW TIMELINE:
${candidate.interviews.map(interview => `
- ${interview.round} (${new Date(interview.date).toLocaleDateString()})
  Interviewer: ${interview.interviewer}
  Notes: ${interview.notes}
`).join('\n')}

We appreciate your interest in ${companyName} and wish you the best in your career journey.

Best regards,
${companyName} Recruitment Team
            `;
            
            console.log('Email would be sent to:', candidate.email);
            console.log(emailContent);
            
            const updatedCandidates = candidates.map(c => 
              c.id === candidate.id ? { ...c, feedbackSent: true, status: 'Feedback Sent' } : c
            );
            saveCandidates(updatedCandidates);
            
            alert(`Feedback email sent successfully to ${candidate.email}!`);
          };

          const viewFeedbackPreview = (candidate) => {
            setSelectedCandidate(candidate);
            setShowPreview(true);
          };

          if (!isCompanySetup) {
            return (
              <div className="min-h-screen bg-gradient-to-br from-yellow-50 via-green-50 to-emerald-50 flex items-center justify-center p-4 relative overflow-hidden">
                <div className="absolute inset-0 overflow-hidden">
                  <div className="absolute top-20 left-10 w-72 h-72 bg-yellow-200 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-pulse"></div>
                  <div className="absolute bottom-20 right-10 w-72 h-72 bg-green-200 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-pulse delay-700"></div>
                </div>

                <div className="w-full max-w-6xl relative z-10">
                  <div className="grid md:grid-cols-2 gap-8 items-center">
                    <div className="hidden md:block space-y-6">
                      <div className="relative rounded-3xl overflow-hidden shadow-2xl group">
                        <img 
                          src="https://images.unsplash.com/photo-1497366216548-37526070297c?w=800&q=80" 
                          alt="Modern Office"
                          className="w-full h-80 object-cover transform group-hover:scale-105 transition-transform duration-500"
                        />
                        <div className="absolute inset-0 bg-gradient-to-t from-black/60 via-black/20 to-transparent"></div>
                        <div className="absolute bottom-0 left-0 right-0 p-6 text-white">
                          <h2 className="text-3xl font-bold mb-2">Transform Your Hiring</h2>
                          <p className="text-sm text-gray-200">Empower candidates with meaningful feedback</p>
                        </div>
                      </div>

                      <div className="grid grid-cols-3 gap-4">
                        <div className="bg-white rounded-2xl p-4 shadow-lg hover:shadow-xl transition-shadow">
                          <div className="relative h-24 mb-3 rounded-xl overflow-hidden">
                            <img 
                              src="https://images.unsplash.com/photo-1522071820081-009f0129c71c?w=400&q=80" 
                              alt="Team Meeting"
                              className="w-full h-full object-cover"
                            />
                            <div className="absolute inset-0 bg-green-500/20"></div>
                          </div>
                          <div className="w-10 h-10 bg-green-100 rounded-full flex items-center justify-center mb-2">
                            <CheckCircle />
                          </div>
                          <p className="text-xs font-semibold text-gray-800">Easy Setup</p>
                          <p className="text-xs text-gray-500">Quick 2-min setup</p>
                        </div>

                        <div className="bg-white rounded-2xl p-4 shadow-lg hover:shadow-xl transition-shadow">
                          <div className="relative h-24 mb-3 rounded-xl overflow-hidden">
                            <img 
                              src="https://images.unsplash.com/photo-1556761175-b413da4baf72?w=400&q=80" 
                              alt="Interview"
                              className="w-full h-full object-cover"
                            />
                            <div className="absolute inset-0 bg-yellow-500/20"></div>
                          </div>
                          <div className="w-10 h-10 bg-yellow-100 rounded-full flex items-center justify-center mb-2">
                            <Send />
                          </div>
                          <p className="text-xs font-semibold text-gray-800">Auto Email</p>
                          <p className="text-xs text-gray-500">Instant feedback</p>
                        </div>

                        <div className="bg-white rounded-2xl p-4 shadow-lg hover:shadow-xl transition-shadow">
                          <div className="relative h-24 mb-3 rounded-xl overflow-hidden">
                            <img 
                              src="https://images.unsplash.com/photo-1454165804606-c3d57bc86b40?w=400&q=80" 
                              alt="Analytics"
                              className="w-full h-full object-cover"
                            />
                            <div className="absolute inset-0 bg-emerald-500/20"></div>
                          </div>
                          <div className="w-10 h-10 bg-emerald-100 rounded-full flex items-center justify-center mb-2">
                            <UserPlus />
                          </div>
                          <p className="text-xs font-semibold text-gray-800">AI Insights</p>
                          <p className="text-xs text-gray-500">Smart analysis</p>
                        </div>
                      </div>

                      <div className="bg-white/80 backdrop-blur-sm rounded-2xl p-6 shadow-lg">
                        <div className="grid grid-cols-3 gap-4 text-center">
                          <div>
                            <p className="text-3xl font-bold text-green-600">500+</p>
                            <p className="text-xs text-gray-600">Companies</p>
                          </div>
                          <div>
                            <p className="text-3xl font-bold text-yellow-600">10K+</p>
                            <p className="text-xs text-gray-600">Candidates</p>
                          </div>
                          <div>
                            <p className="text-3xl font-bold text-emerald-600">95%</p>
                            <p className="text-xs text-gray-600">Satisfaction</p>
                          </div>
                        </div>
                      </div>
                    </div>

                    <div className="bg-white rounded-3xl shadow-2xl overflow-hidden">
                      <div className="relative h-32 overflow-hidden">
                        <img 
                          src="https://images.unsplash.com/photo-1497366811353-6870744d04b2?w=800&q=80" 
                          alt="Office Space"
                          className="w-full h-full object-cover"
                        />
                        <div className="absolute inset-0 bg-gradient-to-br from-green-500/80 to-yellow-500/80"></div>
                        <div className="absolute inset-0 flex items-center justify-center">
                          <div className="bg-white/20 backdrop-blur-sm p-4 rounded-2xl">
                            <Building2 />
                          </div>
                        </div>
                      </div>

                      <div className="p-8 md:p-10">
                        <div className="flex gap-2 mb-8 bg-gray-100 p-1 rounded-xl">
                          <button
                            onClick={() => setLoginMode('signup')}
                            className={`flex-1 py-3 rounded-lg font-semibold transition-all ${
                              loginMode === 'signup'
                                ? 'bg-white text-green-600 shadow-md'
                                : 'text-gray-600 hover:text-gray-800'
                            }`}
                          >
                            Create Workspace
                          </button>
                          <button
                            onClick={() => setLoginMode('login')}
                            className={`flex-1 py-3 rounded-lg font-semibold transition-all ${
                              loginMode === 'login'
                                ? 'bg-white text-green-600 shadow-md'
                                : 'text-gray-600 hover:text-gray-800'
                            }`}
                          >
                            Login to Workspace
                          </button>
                        </div>

                        <div className="mb-8 text-center">
                          <h1 className="text-3xl md:text-4xl font-bold text-gray-800 mb-2">
                            {loginMode === 'signup' ? 'Welcome to' : 'Welcome Back to'} <span className="text-transparent bg-clip-text bg-gradient-to-r from-green-600 to-yellow-600">Evalia</span>
                          </h1>
                          <p className="text-gray-600">
                            {loginMode === 'signup' 
                              ? 'Set up your company workspace to get started'
                              : 'Enter your company code to access your workspace'
                            }
                          </p>
                        </div>
                        
                        {loginMode === 'signup' ? (
                          <div className="space-y-5">
                            <div>
                              <label className="block text-sm font-semibold text-gray-700 mb-2 flex items-center gap-2">
                                <Building2 />
                                Company Name
                              </label>
                              <input
                                type="text"
                                value={companyName}
                                onChange={(e) => setCompanyName(e.target.value)}
                                className="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:ring-2 focus:ring-green-400 focus:border-green-400 transition-all hover:border-green-300"
                                placeholder="Acme Corporation"
                              />
                            </div>
                            
                            <div>
                              <label className="block text-sm font-semibold text-gray-700 mb-2 flex items-center gap-2">
                                <span className="text-yellow-600">#</span>
                                Company Code (Unique ID)
                              </label>
                              <input
                                type="text"
                                value={companyCode}
                                onChange={(e) => setCompanyCode(e.target.value.toUpperCase())}
                                className="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:ring-2 focus:ring-yellow-400 focus:border-yellow-400 transition-all hover:border-yellow-300"
                                placeholder="ACME2024"
                              />
                              <p className="text-xs text-gray-500 mt-2 ml-1">Create a unique code for your company workspace</p>
                            </div>
                            
                            <button
                              onClick={handleCompanySetup}
                              className="w-full bg-gradient-to-r from-green-500 via-green-400 to-yellow-500 text-white py-4 rounded-xl font-bold text-lg hover:from-green-600 hover:to-yellow-600 transform hover:scale-[1.02] active:scale-[0.98] transition-all shadow-lg hover:shadow-xl flex items-center justify-center gap-2 group"
                            >
                              Create Company Workspace 
                              <span className="group-hover:translate-x-1 transition-transform">→</span>
                            </button>
                          </div>
                        ) : (
                          <div className="space-y-5">
                            <div>
                              <label className="block text-sm font-semibold text-gray-700 mb-2 flex items-center gap-2">
                                <span className="text-green-600">#</span>
                                Company Code
                              </label>
                              <input
                                type="text"
                                value={loginCompanyCode}
                                onChange={(e) => setLoginCompanyCode(e.target.value.toUpperCase())}
                                className="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:ring-2 focus:ring-green-400 focus:border-green-400 transition-all hover:border-green-300"
                                placeholder="Enter your company code"
                              />
                              <p className="text-xs text-gray-500 mt-2 ml-1">Enter the unique code provided during setup</p>
                            </div>
                            
                            <button
                              onClick={handleCompanyLogin}
                              className="w-full bg-gradient-to-r from-green-500 to-emerald-500 text-white py-4 rounded-xl font-bold text-lg hover:from-green-600 hover:to-emerald-600 transform hover:scale-[1.02] active:scale-[0.98] transition-all shadow-lg hover:shadow-xl flex items-center justify-center gap-2 group"
                            >
                              Access Workspace 
                              <span className="group-hover:translate-x-1 transition-transform">→</span>
                            </button>

                            <div className="bg-blue-50 rounded-xl p-4 border border-blue-100">
                              <p className="text-sm text-blue-800 flex items-start gap-2">
                                <AlertCircle />
                                <span>Don't have a company code? <button onClick={() => setLoginMode('signup')} className="font-semibold underline">Create Workspace</button></span>
                              </p>
                            </div>
                          </div>
                        )}

                        <div className="relative my-6">
                          <div className="absolute inset-0 flex items-center">
                            <div className="w-full border-t border-gray-200"></div>
                          </div>
                          <div className="relative flex justify-center text-xs">
                            <span className="px-3 bg-white text-gray-500 flex items-center gap-1">
                              <CheckCircle />
                              Secure & Private
                            </span>
                          </div>
                        </div>

                        <div className="bg-gradient-to-r from-green-50 via-yellow-50 to-green-50 rounded-xl p-4 border border-green-100">
                          <p className="text-sm text-gray-700 text-center flex items-center justify-center gap-2">
                            <span className="text-xl">🔒</span>
                            <span><span className="font-semibold">Your data is safe.</span> Each company has an isolated workspace.</span>
                          </p>
                        </div>

                        <div className="pt-4 flex items-center justify-center gap-6 text-xs text-gray-500">
                          <div className="flex items-center gap-1">
                            <CheckCircle />
                            <span>GDPR Compliant</span>
                          </div>
                          <div className="flex items-center gap-1">
                            <CheckCircle />
                            <span>ISO Certified</span>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            );
          }

          return (
            <div className="min-h-screen bg-gradient-to-br from-indigo-50 via-purple-50 to-blue-50">
              <div className="container mx-auto px-4 py-8 max-w-7xl">
                <div className="bg-white rounded-lg shadow-lg p-6 mb-6">
                  <div className="flex items-center justify-between">
                    <div>
                      <div className="flex items-center gap-3 mb-2">
                        <Building2 />
                        <h1 className="text-3xl font-bold text-gray-800">Evalia HR Portal</h1>
                      </div>
                      <p className="text-gray-600">{companyName} - Workspace: {companyCode}</p>
                    </div>
                    <div className="text-right">
                      <p className="text-sm text-gray-500">Total Candidates</p>
                      <p className="text-3xl font-bold text-indigo-600">{candidates.length}</p>
                    </div>
                  </div>
                </div>

                <div className="bg-white rounded-lg shadow-lg mb-6">
                  <div className="flex border-b">
                    <button
                      onClick={() => setActiveTab('dashboard')}
                      className={`flex-1 px-6 py-4 font-semibold transition-colors ${
                        activeTab === 'dashboard'
                          ? 'text-indigo-600 border-b-2 border-indigo-600'
                          : 'text-gray-500 hover:text-gray-700'
                      }`}
                    >
                      <div className="flex items-center justify-center gap-2">
                        <Eye />
                        Candidate Dashboard
                      </div>
                    </button>
                    <button
                      onClick={() => setActiveTab('add')}
                      className={`flex-1 px-6 py-4 font-semibold transition-colors ${
                        activeTab === 'add'
                          ? 'text-indigo-600 border-b-2 border-indigo-600'
                          : 'text-gray-500 hover:text-gray-700'
                      }`}
                    >
                      <div className="flex items-center justify-center gap-2">
                        <UserPlus />
                        Add Interview Feedback
                      </div>
                    </button>
                  </div>

                  {activeTab === 'dashboard' && (
                    <div className="p-6">
                      <h2 className="text-2xl font-bold text-gray-800 mb-6">All Candidates</h2>
                      
                      {candidates.length === 0 ? (
                        <div className="text-center py-12">
                          <AlertCircle />
                          <p className="text-gray-500 text-lg mt-4">No candidates yet. Add your first interview feedback!</p>
                        </div>
                      ) : (
                        <div className="overflow-x-auto">
                          <table className="w-full">
                            <thead className="bg-gray-50">
                              <tr>
                                <th className="px-4 py-3 text-left text-sm font-semibold text-gray-700">Candidate ID</th>
                                <th className="px-4 py-3 text-left text-sm font-semibold text-gray-700">Name</th>
                                <th className="px-4 py-3 text-left text-sm font-semibold text-gray-700">Position</th>
                                <th className="px-4 py-3 text-left text-sm font-semibold text-gray-700">Email</th>
                                <th className="px-4 py-3 text-left text-sm font-semibold text-gray-700">Interviews</th>
                                <th className="px-4 py-3 text-left text-sm font-semibold text-gray-700">Status</th>
                                <th className="px-4 py-3 text-left text-sm font-semibold text-gray-700">Actions</th>
                              </tr>
                            </thead>
                            <tbody className="divide-y divide-gray-200">
                              {candidates.map((candidate) => (
                                <tr key={candidate.id} className="hover:bg-gray-50">
                                  <td className="px-4 py-3 text-sm text-gray-900 font-medium">{candidate.id}</td>
                                  <td className="px-4 py-3 text-sm text-gray-900">{candidate.name}</td>
                                  <td className="px-4 py-3 text-sm text-gray-700">{candidate.position}</td>
                                  <td className="px-4 py-3 text-sm text-gray-700">{candidate.email}</td>
                                  <td className="px-4 py-3 text-sm text-gray-700">{candidate.interviews.length} rounds</td>
                                  <td className="px-4 py-3 text-sm">
                                    <span className={`px-2 py-1 rounded-full text-xs font-medium ${
                                      candidate.feedbackSent 
                                        ? 'bg-green-100 text-green-800' 
                                        : 'bg-yellow-100 text-yellow-800'
                                    }`}>
                                      {candidate.status}
                                    </span>
                                  </td>
                                  <td className="px-4 py-3 text-sm space-x-2">
                                    <button
                                      onClick={() => viewFeedbackPreview(candidate)}
                                      className="text-indigo-600 hover:text-indigo-800 font-medium"
                                    >
                                      Preview
                                    </button>
                                    {!candidate.feedbackSent && (
                                      <button
                                        onClick={() => handleSendFeedback(candidate)}
                                        className="text-green-600 hover:text-green-800 font-medium"
                                      >
                                        Send Feedback
                                      </button>
                                    )}
                                  </td>
                                </tr>
                              ))}
                            </tbody>
                          </table>
                        </div>
                      )}
                    </div>
                  )}

                  {activeTab === 'add' && (
                    <div className="p-6">
                      <h2 className="text-2xl font-bold text-gray-800 mb-6">Add Interview Feedback</h2>
                      <div className="space-y-4">
                        <div className="grid md:grid-cols-2 gap-4">
                          <div>
                            <label className="block text-sm font-medium text-gray-700 mb-2">
                              Candidate Name *
                            </label>
                            <input
                              type="text"
                              value={candidateName}
                              onChange={(e) => setCandidateName(e.target.value)}
                              className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                              placeholder="John Doe"
                            />
                          </div>
                          <div>
                            <label className="block text-sm font-medium text-gray-700 mb-2">
                              Candidate Email *
                            </label>
                            <input
                              type="email"
                              value={candidateEmail}
                              onChange={(e) => setCandidateEmail(e.target.value)}
                              className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                              placeholder="john.doe@email.com"
                            />
                          </div>
                        </div>

                        <div className="grid md:grid-cols-2 gap-4">
                          <div>
                            <label className="block text-sm font-medium text-gray-700 mb-2">
                              Applied Position *
                            </label>
                            <input
                              type="text"
                              value={appliedPosition}
                              onChange={(e) => setAppliedPosition(e.target.value)}
                              className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                              placeholder="Senior Software Engineer"
                            />
                          </div>
                          <div>
                            <label className="block text-sm font-medium text-gray-700 mb-2">
                              Candidate ID *
                            </label>
                            <input
                              type="text"
                              value={candidateId}
                              onChange={(e) => setCandidateId(e.target.value)}
                              className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                              placeholder="CAND-2024-001"
                            />
                          </div>
                        </div>

                        <div className="grid md:grid-cols-2 gap-4">
                          <div>
                            <label className="block text-sm font-medium text-gray-700 mb-2">
                              Interviewer Name *
                            </label>
                            <input
                              type="text"
                              value={interviewerName}
                              onChange={(e) => setInterviewerName(e.target.value)}
                              className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                              placeholder="Jane Smith"
                            />
                          </div>
                          <div>
                            <label className="block text-sm font-medium text-gray-700 mb-2">
                              Interview Round *
                            </label>
                            <select
                              value={interviewRound}
                              onChange={(e) => setInterviewRound(e.target.value)}
                              className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                            >
                              <option value="">Select Round</option>
                              <option value="Screening">Screening</option>
                              <option value="Technical Round 1">Technical Round 1</option>
                              <option value="Technical Round 2">Technical Round 2</option>
                              <option value="Managerial Round">Managerial Round</option>
                              <option value="HR Round">HR Round</option>
                              <option value="Final Round">Final Round</option>
                            </select>
                          </div>
                        </div>

                        <div>
                          <label className="block text-sm font-medium text-gray-700 mb-2">
                            Interview Notes *
                          </label>
                          <textarea
                            value={interviewNotes}
                            onChange={(e) => setInterviewNotes(e.target.value)}
                            className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent h-32"
                            placeholder="Enter detailed observations about the candidate's performance, technical skills, communication abilities, and areas of improvement..."
                          />
                        </div>

                        <button
                          onClick={handleAddInterview}
                          className="w-full bg-indigo-600 text-white py-3 rounded-lg font-semibold hover:bg-indigo-700 transition-colors flex items-center justify-center gap-2"
                        >
                          <CheckCircle />
                          Save Interview Feedback
                        </button>
                      </div>
                    </div>
                  )}
                </div>

                {showPreview && selectedCandidate && (
                  <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
                    <div className="bg-white rounded-lg max-w-3xl w-full max-h-[90vh] overflow-y-auto">
                      <div className="p-6">
                        <div className="flex justify-between items-start mb-6">
                          <h3 className="text-2xl font-bold text-gray-800">Feedback Preview</h3>
                          <button
                            onClick={() => setShowPreview(false)}
                            className="text-gray-500 hover:text-gray-700 text-2xl"
                          >
                            ×
                          </button>
                        </div>

                        <div className="space-y-6">
                          <div className="bg-gray-50 rounded-lg p-4">
                            <p className="text-sm text-gray-600">To: {selectedCandidate.email}</p>
                            <p className="text-sm text-gray-600">Subject: Interview Feedback - {selectedCandidate.position}</p>
                          </div>

                          <div>
                            <p className="text-gray-700 mb-4">Dear {selectedCandidate.name},</p>
                            <p className="text-gray-700 mb-4">
                              Thank you for taking the time to interview with {companyName} for the {selectedCandidate.position} position.
                            </p>
                            <p className="text-gray-700 mb-4">
                              After careful consideration of your interviews, we wanted to provide you with detailed feedback to help you in your career journey.
                            </p>
                          </div>

                          {(() => {
                            const feedback = generateFeedback(selectedCandidate);
                            return (
                              <>
                                <div className="bg-green-50 rounded-lg p-4 border border-green-200">
                                  <h4 className="font-bold text-green-800 mb-3">YOUR STRENGTHS:</h4>
                                  <ul className="space-y-2">
                                    {feedback.strengths.map((s, i) => (
                                      <li key={i} className="text-gray-700">• {s}</li>
                                    ))}
                                  </ul>
                                </div>

                                <div className="bg-blue-50 rounded-lg p-4 border border-blue-200">
                                  <h4 className="font-bold text-blue-800 mb-3">AREAS FOR GROWTH:</h4>
                                  <ul className="space-y-2">
                                    {feedback.improvements.map((imp, i) => (
                                      <li key={i} className="text-gray-700">• {imp}</li>
                                    ))}
                                  </ul>
                                </div>
                              </>
                            );
                          })()}

                          <div className="bg-gray-50 rounded-lg p-4">
                            <h4 className="font-bold text-gray-800 mb-3">INTERVIEW TIMELINE:</h4>
                            <div className="space-y-3">
                              {selectedCandidate.interviews.map((interview, idx) => (
                                <div key={idx} className="bg-white rounded p-3 border border-gray-200">
                                  <div className="flex justify-between mb-2">
                                    <span className="font-semibold text-gray-800">{interview.round}</span>
                                    <span className="text-sm text-gray-500">
                                      {new Date(interview.date).toLocaleDateString()}
                                    </span>
                                  </div>
                                  <p className="text-sm text-gray-600 mb-1">Interviewer: {interview.interviewer}</p>
                                  <p className="text-sm text-gray-700">Notes: {interview.notes}</p>
                                </div>
                              ))}
                            </div>
                          </div>

                          <p className="text-gray-700">
                            We appreciate your interest in {companyName} and wish you the best in your career journey.
                          </p>
                          <p className="text-gray-700">
                            Best regards,<br />
                            {companyName} Recruitment Team
                          </p>
                        </div>

                        <div className="flex gap-3 mt-6">
                          <button
                            onClick={() => setShowPreview(false)}
                            className="flex-1 bg-gray-200 text-gray-700 py-2 rounded-lg font-semibold hover:bg-gray-300 transition-colors"
                          >
                            Close
                          </button>
                          {!selectedCandidate.feedbackSent && (
                            <button
                              onClick={() => {
                                handleSendFeedback(selectedCandidate);
                                setShowPreview(false);
                              }}
                              className="flex-1 bg-green-600 text-white py-2 rounded-lg font-semibold hover:bg-green-700 transition-colors flex items-center justify-center gap-2"
                            >
                              <Mail />
                              Send Email Now
                            </button>
                          )}
                        </div>
                      </div>
                    </div>
                  </div>
                )}
              </div>
            </div>
          );
        }

        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(React.createElement(EvaliaHRPlatform));
    </script>
</body>
</html>
